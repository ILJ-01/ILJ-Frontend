name: Monthly Database Backup

on:
  schedule:
    - cron: '0 0 1 * *' # Runs at 00:00 on the 1st of every month
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: allows the action to push to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 Client
        run: |
          sudo apt-get install -y postgresql-common
          # Yes, automatically enable the PG repo script
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Create Backup
        env:
          DATABASE_URL_SECRET: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL_SECRET" ]; then
            echo "❌ ERROR: SUPABASE_DB_URL secret is EMPTY or NOT FOUND."
            echo "Please go to Settings > Secrets and variables > Actions and add 'SUPABASE_DB_URL'."
            exit 1
          else
            echo "✅ Secret found (length: ${#DATABASE_URL_SECRET} chars). Proceeding..."
          fi
          
          
          mkdir -p backups
          # Pass the secret directly to pg_dump to avoid variable expansion issues
          # Use explicit path to ensure we use version 17
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL_SECRET" --clean --if-exists --no-owner --no-privileges > backups/backup_$(date +%Y-%m-%d).sql

      - name: Commit and Push Backup
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add backups/*.sql
          git commit -m "chore: monthly database backup [$(date +%Y-%m-%d)]"
          git push
