name: Automated Database Backup

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 02:00 UTC (07:30 AM IST)
  workflow_dispatch: # Allows manual triggering from GitHub UI at any time

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: allows the action to push to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 Client
        run: |
          sudo apt-get remove -y postgresql-client-14 postgresql-client-common || true
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Create Backup
        env:
          DATABASE_URL_SECRET: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL_SECRET" ]; then
            echo "❌ ERROR: SUPABASE_DB_URL secret is EMPTY or NOT FOUND."
            echo "Please go to Settings > Secrets and variables > Actions and add 'SUPABASE_DB_URL'."
            exit 1
          else
            echo "✅ Secret found (length: ${#DATABASE_URL_SECRET} chars). Proceeding..."
          fi
          
          mkdir -p backups
          # Full dump of all schemas, tables, sequences, functions, and data
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL_SECRET" --clean --if-exists --no-owner --no-privileges > backups/backup_$(date +%Y-%m-%d).sql
          echo "✅ Backup created successfully: backups/backup_$(date +%Y-%m-%d).sql ($(du -h backups/backup_$(date +%Y-%m-%d).sql | cut -f1))"

      - name: Commit and Push Backup
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add backups/*.sql
          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected. Backup is already up to date."
          else
            git commit -m "chore: automated database backup [$(date +%Y-%m-%d)]"
            git pull --rebase origin main || true
            git push
            echo "✅ Backup committed and pushed to repository."
          fi
