name: Monthly Database Backup

on:
  schedule:
    - cron: '0 0 1 * *' # Runs at 00:00 on the 1st of every month
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: allows the action to push to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create Backup
        env:
          # You must add this secret in GitHub Repo Settings > Secrets and variables > Actions
          # Format: postgres://postgres.[ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backups
          # Flags: --clean (drop objects before creating), --if-exists, --no-owner (improves compatibility)
          pg_dump "$DATABASE_URL" --clean --if-exists --no-owner --no-privileges > backups/backup_$(date +%Y-%m-%d).sql

      - name: Commit and Push Backup
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add backups/*.sql
          git commit -m "chore: monthly database backup [$(date +%Y-%m-%d)]"
          git push
